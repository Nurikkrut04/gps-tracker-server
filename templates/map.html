<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GPS Tracker Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([51.16, 71.49], 15);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18
    }).addTo(map);

    fetch("/api/track")
      .then(res => res.json())
      .then(data => {
        if (data.length === 0) return;

        const latlngs = data.map(p => [p.lat, p.lon]);
        L.polyline(latlngs, { color: 'red' }).addTo(map);
        L.marker(latlngs.at(-1)).addTo(map).bindPopup("Последняя точка").openPopup();
        map.setView(latlngs.at(-1), 17);
      });
  </script>
</body>
</html>
